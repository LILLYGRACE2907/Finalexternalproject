{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <div class="badge bg-primary bg-opacity-20 text-info p-3 rounded-circle mb-3">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h3 class="text-white fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <form method="POST" action="{% url 'login' %}" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_email" class="form-label text-light">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                            {{ form.email }}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label text-light">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
                            {{ form.password }}
                            <button class="btn btn-outline-secondary border-secondary" type="button" onclick="togglePasswordVisibility('id_password', 'togglePassIcon')">
                                <i class="bi bi-eye text-muted" id="togglePassIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <p class="text-muted small mb-0">
                        Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none fw-semibold">Register now</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
